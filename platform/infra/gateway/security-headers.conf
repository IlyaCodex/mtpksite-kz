# Заголовки безопасности — перенос server/snippets/security-headers.conf.
# В nginx add_header не наследуется в location со своим add_header, поэтому
# файл подключается и в server, и в таких location.
#
# HSTS без includeSubDomains/preload. Если системный nginx сервера уже ставит эти
# заголовки — убрать их там, иначе будут дубли.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
# X-Frame-Options не ставим: он ломает Вебвизор Метрики; кликджекинг закрыт frame-ancestors.
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# CSP: счётчики Метрики и Roistat, карта Яндекса (пиксели статистики — log.api-maps.yandex.ru, yandex.ru), видео VK и YouTube.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://cloud.roistat.com https://*.roistat.com https://api-maps.yandex.ru https://yastatic.net https://*.yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://yastatic.net https://*.yastatic.net; font-src 'self' https://fonts.gstatic.com https://yastatic.net https://*.yastatic.net data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://mc.yandex.ru https://mc.yandex.kz https://yastatic.net https://*.yastatic.net https://api-maps.yandex.ru https://*.maps.yandex.net https://*.maps.yandex.ru https://core-renderer-tiles.maps.yandex.net https://cloud.roistat.com https://*.roistat.com https://i.ytimg.com https://log.api-maps.yandex.ru https://yandex.ru; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.kz wss://mc.yandex.ru wss://mc.yandex.com wss://mc.yandex.kz https://cloud.roistat.com https://*.roistat.com https://api-maps.yandex.ru https://*.maps.yandex.net https://*.maps.yandex.ru https://yastatic.net https://*.yastatic.net https://yandex.ru; frame-src 'self' https://vkvideo.ru https://vk.com https://*.vk.com https://yandex.ru https://mc.yandex.ru https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; child-src 'self' blob: https://yandex.ru; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://metrika.yandex.ru https://webvisor.com; upgrade-insecure-requests" always;
